name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pterodactyl-valkey
          tags: |
            type=raw,value=9
            type=sha

      - name: Build for test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: valkey-test:ci

      # Boot it the way Wings does: its uid, its dropped capabilities,
      # no-new-privileges, a tty, and a startup line prefixed the way the
      # Renode panel prefixes it. Nothing is pushed unless every check passes.
      - name: Boot test
        run: |
          set -e
          PW=CiTestPassw0rdXyz12345
          CLI="docker run --rm --network host --entrypoint valkey-cli valkey-test:ci -p 25726 --no-auth-warning"
          mkdir -p /tmp/vol && sudo chown 988:988 /tmp/vol
          STARTUP=': renode_banner_begin; if [ -n "$RENODE_BANNER" ]; then printf "%s" "$RENODE_BANNER" | base64 -d 2>/dev/null || true; fi; : renode_banner_end; valkey-server /tmp/valkey.conf'
          run() {
            docker run -d -t -i --name ci --user 988:988 \
              --cap-drop setpcap --cap-drop mknod --cap-drop audit_write --cap-drop net_raw \
              --cap-drop dac_override --cap-drop fowner --cap-drop fsetid --cap-drop net_bind_service \
              --cap-drop sys_chroot --cap-drop setfcap --security-opt no-new-privileges \
              --memory 512m -p 25726:25726 -v /tmp/vol:/home/container \
              -e VALKEY_PASSWORD=$PW -e VALKEY_EVICTION_POLICY=noeviction -e SERVER_PORT=25726 \
              -e RENODE_BANNER="$(printf 'RENODE BANNER OK\n' | base64)" \
              -e STARTUP="$STARTUP" valkey-test:ci
            for i in $(seq 1 30); do
              docker logs ci 2>&1 | grep -q 'Ready to accept connections' && break
              docker inspect -f '{{.State.Running}}' ci | grep -q true || break
              sleep 1
            done
            docker logs ci 2>&1 | tail -15
            docker logs ci 2>&1 | grep -q 'RENODE BANNER OK'
            docker logs ci 2>&1 | grep -q 'Ready to accept connections'
          }
          stop() {
            docker kill --signal INT ci
            for i in $(seq 1 30); do docker inspect -f '{{.State.Running}}' ci | grep -q false && break; sleep 1; done
            docker inspect -f 'exit={{.State.ExitCode}} running={{.State.Running}}' ci | tee /dev/stderr | grep -q 'exit=0 running=false'
            docker rm ci >/dev/null
          }

          run
          test "$($CLI -a $PW PING)" = PONG
          $CLI -a $PW SET renode:ci persisted
          test "$($CLI -a $PW GET renode:ci)" = persisted
          $CLI PING 2>&1 | tee /dev/stderr | grep -q NOAUTH
          $CLI -a wrongpassword PING 2>&1 | tee /dev/stderr | grep -qE 'WRONGPASS|invalid'
          MAX=$($CLI -a $PW CONFIG GET maxmemory | tail -1)
          echo "maxmemory=$MAX"
          test "$MAX" -gt 0 && test "$MAX" -lt 536870912
          stop

          # Same volume: the value must survive a stop and start.
          run
          test "$($CLI -a $PW GET renode:ci)" = persisted
          stop

      # Valkey without a password on a public port is the one thing this image
      # must never do.
      - name: Failure exits
        run: |
          mkdir -p /tmp/vol2 && sudo chown 988:988 /tmp/vol2
          docker run -d -t -i --name bad --user 988:988 -v /tmp/vol2:/home/container \
            -e SERVER_PORT=25727 -e STARTUP='valkey-server /tmp/valkey.conf' valkey-test:ci
          for i in $(seq 1 20); do docker inspect -f '{{.State.Running}}' bad | grep -q false && break; sleep 1; done
          docker logs bad 2>&1 | tail -5
          docker inspect -f 'exit={{.State.ExitCode}} running={{.State.Running}}' bad | tee /dev/stderr | grep -q 'exit=1 running=false'

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
